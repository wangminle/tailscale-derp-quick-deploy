name: tests

on:
  push:
  pull_request:

jobs:
  bash5:
    name: Bash 5 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Bash 5
        run: |
          bash --version | head -1
          bash -c '[[ ${BASH_VERSINFO[0]} -ge 5 ]]'
      - name: Main suite
        run: bash tests/test_deploy_script.sh
      - name: Review regressions
        run: bash tests/test_review_regressions.sh
      - name: S2 failure-path regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc shellcheck
          bash tests/test_s2_fixes.sh
      - name: S2 real flock and permission evidence
        run: sudo bash tests/test_s2_evidence.sh
      - name: C stage contracts and behavior
        run: |
          bash tests/test_c_stage.sh
          sudo bash tests/test_c_stage.sh test_root_probe_path_trust test_bug072_root_rejects_untrusted_state_ancestors
      - name: D stage contracts and behavior
        run: bash tests/test_d_stage.sh
      - name: ShellCheck errors
        run: shellcheck -S error scripts/deploy_derper_ip_selfsigned.sh tests/*.sh
